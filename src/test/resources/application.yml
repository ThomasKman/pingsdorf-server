spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/pingsdorf-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

pingsdorf:
  jwt:
    secret: test-only-secret-please-change-me-32bytes!
    issuer: pingsdorf-test
    ttl: 1h
  storage:
    local:
      base-dir: ${java.io.tmpdir}/pingsdorf-test-uploads
    public-base-url: http://localhost:8080/files
